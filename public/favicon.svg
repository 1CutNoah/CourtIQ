<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background with rounded corners -->
  <rect width="64" height="64" rx="14" fill="#0a0b0d"/>
  <!-- Basketball circle -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#00c2a8" stroke-width="2.5"/>
  <!-- Vertical seam curve -->
  <path d="M32 12 Q42 32 32 52" fill="none" stroke="#00c2a8" stroke-width="2" opacity="0.7"/>
  <path d="M32 12 Q22 32 32 52" fill="none" stroke="#00c2a8" stroke-width="2" opacity="0.7"/>
  <!-- Horizontal seam -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#00c2a8" stroke-width="2" opacity="0.7"/>
  <!-- IQ text -->
  <text x="32" y="37" font-family="Arial Black,sans-serif" font-size="15" font-weight="900" text-anchor="middle" fill="#00c2a8">IQ</text>
</svg>
